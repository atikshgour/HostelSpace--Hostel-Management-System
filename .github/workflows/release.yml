name: Build release containers
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build only; no automatic deployment or credentials
        run: |
          docker build -t hostelspace-backend:${{ github.sha }} backend
          docker build --build-arg DJANGO_API_ORIGIN=http://backend:8000 -t hostelspace-frontend:${{ github.sha }} frontend
          docker save hostelspace-backend:${{ github.sha }} hostelspace-frontend:${{ github.sha }} | gzip > hostelspace-images.tar.gz
      - uses: actions/upload-artifact@v4
        with: {name: release-images, path: hostelspace-images.tar.gz}
