# Owner: Atiksh Gour | Reviewer: Anvi Srinivas | US-20 | NFR-05 | Sprint 1
name: CI
on:
  pull_request:
  push:
    branches: [main, Atiksh]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci -- --runInBand
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
  backend:
    name: Backend lint and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: hostelspace
          POSTGRES_USER: hostelspace
          POSTGRES_PASSWORD: ci-only-disposable
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hostelspace -d hostelspace"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      DJANGO_SECRET_KEY: ci-only-disposable-key-never-used-outside-ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PASSWORD: ci-only-disposable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check
      - run: pytest --junitxml=test-results.xml --cov=config.health --cov-report=xml --cov-report=term-missing --cov-fail-under=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: |
            backend/test-results.xml
            backend/coverage.xml
          if-no-files-found: warn
  security:
    name: Dependency and Python security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci --prefix frontend
      - name: Run all scanners and preserve failures
        shell: bash
        run: |
          mkdir -p security-results
          status=0
          bandit -r backend/config backend/manage.py -f json -o security-results/bandit.json || status=1
          pip-audit -r backend/requirements-dev.txt --format=json --output=security-results/pip-audit.json || status=1
          npm audit --prefix frontend --audit-level=high --json > security-results/npm-audit.json || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: security-results/
          if-no-files-found: warn
  compose:
    name: Compose build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-disposable
      DJANGO_SECRET_KEY: ci-only-disposable-key-never-used-outside-ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Check all service responses
        run: |
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:3000/ | grep -q HostelSpace
          curl --fail http://127.0.0.1:3000/health
          curl --fail http://127.0.0.1:8000/api/health/
      - name: Capture container logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-logs
          path: compose.log
      - name: Stop disposable CI services
        if: always()
        run: docker compose down
  required:
    name: CI required
    if: always()
    needs: [frontend, backend, security, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Reject failed, skipped or cancelled checks
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          if any(job["result"] != "success" for job in results.values()):
              raise SystemExit(1)
          PY
