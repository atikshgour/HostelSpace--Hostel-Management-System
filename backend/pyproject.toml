[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.ci"
testpaths = ["tests", "apps"]
addopts = "--strict-markers"
markers = [
  "unit: isolated logic, serializer or service-level tests",
  "integration: API, ORM and database integration tests",
  "system: application workflow tests",
  "security: authorization, ownership and protected inputs",
  "reliability: retries, duplicate prevention and concurrency",
]
[tool.ruff]
target-version = "py313"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["E402"]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/migrations/*"]
