name: hostelspace
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hostelspace}
      POSTGRES_USER: ${POSTGRES_USER:-hostelspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local PostgreSQL password in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a local Django key in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hostelspace}
      POSTGRES_USER: ${POSTGRES_USER:-hostelspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local PostgreSQL password in .env}
      POSTGRES_HOST: db
      HOSTELSPACE_SQLITE: "0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-hostelspace}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hostelspace}
      PAYMENT_MODE: ${PAYMENT_MODE:-simulation}
      ALLOW_PAYMENT_SIMULATION: ${ALLOW_PAYMENT_SIMULATION:-1}
      HOSTELSPACE_DEMO_PASSWORD: ${HOSTELSPACE_DEMO_PASSWORD:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api,testserver}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  frontend:
    build:
      context: ./frontend
      args:
        DJANGO_API_ORIGIN: http://api:8000
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
volumes:
  postgres_data:
