services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hostelspace
      POSTGRES_USER: hostelspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private POSTGRES_PASSWORD in root .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostelspace -d hostelspace"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a private DJANGO_SECRET_KEY in root .env}
      HOSTELSPACE_SQLITE: "0"
      DATABASE_URL: postgresql://hostelspace:${POSTGRES_PASSWORD}@db:5432/hostelspace
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      PAYMENT_MODE: ${PAYMENT_MODE:-disabled}
      ALLOW_PAYMENT_SIMULATION: ${ALLOW_PAYMENT_SIMULATION:-0}
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args: {DJANGO_API_ORIGIN: "http://backend:8000"}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
